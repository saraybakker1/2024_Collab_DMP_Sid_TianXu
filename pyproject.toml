[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "collab_dmp"
version = "0.1.0"
requires-python = "==3.9.21"
dependencies = [
    "numpy==1.26.0",
    "matplotlib==3.8.2",
    "pybullet==3.2.5",
    "pyyaml",
    "scipy>=1.7,<2.0",
    "imageio<=2.31.1",
    "sympy<=1.14.0",
    "attrdict>=2.0.1,<3.0.0",
    "bulletarm",
    "pyquaternion>=0.9.9,<0.10.0",
    "seaborn",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.1",
]

dev = [
    "black",
    "pytest==8.4.1",
    "pylasadataset==0.1.1",
]

[tool.uv.sources]
bulletarm = { git = "https://github.com/ColinKohler/BulletArm.git" }

[dependency-groups]
dev = [
    "black",
    "pytest==8.4.1",
    "pylasadataset==0.1.1",
]

[tool.setuptools]
packages = ["dmp", "Robot_Sim", "Robot_Sim.robots"]

[tool.setuptools.package-dir]
dmp = "DMP/dmp"